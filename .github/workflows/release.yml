name: Release

on:
  push:
    tags:
      - 'v*' # e.g. v0.1.0-preview.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer derives the version from this tag

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release

      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: |
          dotnet pack src/MigrationLint.Cli/MigrationLint.Cli.csproj --configuration Release --no-build --output ./artifacts
          dotnet pack src/MigrationLint.Core/MigrationLint.Core.csproj --configuration Release --no-build --output ./artifacts

      # Distribution is GitHub-only: the built .nupkg files are attached to the release so
      # developers can install the tool from source or from the downloaded package.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.nupkg
          generate_release_notes: true
